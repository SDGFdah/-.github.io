<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet - Admin (Connected)</title>
    
    <!-- โหลด Firebase SDK แบบมาตรฐาน (ใช้ได้กับ Browser ทันที) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #2d5a27; --s: #e67e22; --bg: #f4f7f1; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; transition: 0.5s; }
        header { background: var(--p); color: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-bar { font-size: 0.8rem; padding: 5px; background: rgba(0,0,0,0.2); }
        
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; color: #888; transition: 0.3s; }
        .nav-item.active { color: var(--p); border-bottom: 4px solid var(--p); background: #f9f9f9; }

        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { 
            background: white; border-radius: 25px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-left: 10px solid var(--s); position: relative; animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn { border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-done { background: var(--p); color: white; }
        .btn-cancel { background: #fdf2f2; color: #e74c3c; font-size: 0.8rem; }

        /* ตกแต่ง Mascot */
        #mascot-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; cursor: move; width: 120px; }
        #mascot-img { width: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }

        .settings-pane { background: white; padding: 25px; border-radius: 25px; max-width: 500px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input[type="text"], input[type="color"] { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #eee; box-sizing: border-box; }
    </style>
</head>
<body ondrop="dropMascot(event)" ondragover="allowDrop(event)">

<header>
    <h1 style="margin:0; font-size: 1.5rem;">NATURE GOURMET ADMIN</h1>
    <div id="net-status" class="status-bar">⚪ กำลังเชื่อมต่อ...</div>
</header>

<div class="nav">
    <div class="nav-item active" onclick="changePage('live')">ออเดอร์ใหม่</div>
    <div class="nav-item" onclick="changePage('history')">ประวัติ</div>
    <div class="nav-item" onclick="changePage('settings')">ตกแต่งหน้าจอ</div>
</div>

<div class="container">
    <!-- หน้าออเดอร์สด -->
    <div id="page-live" class="grid">
        <p style="text-align:center; grid-column:1/-1;">รอออเดอร์ใหม่เข้ามา...</p>
    </div>

    <!-- หน้าประวัติ -->
    <div id="page-history" style="display:none;" class="grid"></div>
    
    <!-- หน้าตั้งค่า -->
    <div id="page-settings" style="display:none;">
        <div class="settings-pane">
            <h3 style="margin-top:0">🎨 ตกแต่งเฉพาะเครื่องนี้</h3>
            <div style="margin-bottom:15px">
                <label>สีพื้นหลัง:</label>
                <input type="color" id="set-bg" onchange="updateDecor()">
            </div>
            <div style="margin-bottom:15px">
                <label>รูปมาสคอต (URL รูปจากเน็ต):</label>
                <input type="text" id="set-img" placeholder="วางลิงก์รูป .png หรือ .jpg" oninput="updateDecor()">
            </div>
            <div style="margin-bottom:15px">
                <label>หรืออัปโหลดรูป:</label>
                <input type="file" accept="image/*" onchange="uploadImg(this)">
            </div>
            <button class="btn btn-done" onclick="saveDecor()">💾 บันทึกการตกแต่ง</button>
        </div>
    </div>
</div>

<div id="mascot-container" draggable="true" ondragstart="dragMascot(event)">
    <img src="https://cdn-icons-png.flaticon.com/512/3081/3081986.png" id="mascot-img">
</div>

<audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
        // [1] Config ของพี่ที่ตรวจสอบแล้วว่าถูกต้อง
    const firebaseConfig = {
        apiKey: "AIzaSyARQ9iDSAP-HSnZlHH854p1qnUPCmjtyvo",
        authDomain: "project-8472595372192265726.firebaseapp.com",
        databaseURL: "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "project-8472595372192265726",
        storageBucket: "project-8472595372192265726.firebasestorage.app",
        messagingSenderId: "983091918200",
        appId: "1:983091918200:web:ec462b7eaf04b724f2448d"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // [2] เปลี่ยนชื่อจาก 'orders' เป็น 'verified_orders' ให้ตรงกับ Rules ของพี่
    db.ref('verified_orders').on('value', snap => {
        const data = snap.val();
        render(data, 'page-live', true); // ส่งข้อมูลไปแสดงผลที่หน้าจอ
    });

    // ดึงข้อมูลประวัติ
    db.ref('history').limitToLast(30).on('value', snap => {
        render(snap.val(), 'page-history', false);
    });

    // ฟังก์ชันย้ายออเดอร์เมื่อกด "เสร็จงาน"
    async function moveOrder(key, status) {
        const snap = await db.ref('verified_orders/' + key).once('value');
        const val = snap.val();
        if(val) {
            val.status = status;
            await db.ref('history').push(val);
            await db.ref('verified_orders/' + key).remove();
        }
    }

    // ฟังก์ชัน Render แสดงผลการ์ดออเดอร์ (ใช้ของเดิมที่พี่ชอบได้เลย)
    function render(data, targetId, isLive) {
        const div = document.getElementById(targetId);
        if(!data) { div.innerHTML = "<p style='text-align:center;'>ไม่มีออเดอร์</p>"; return; }
        
        let html = "";
        Object.keys(data).reverse().forEach(key => {
            const o = data[key];
            html += `
                <div class="card">
                    <b>คุณ:</b> ${o.customer || 'ลูกค้า'}<br>
                    <b>ยอด:</b> ${o.total_price || 0} บาท<br>
                    ${isLive ? `<button onclick="moveOrder('${key}', 'completed')">เสร็จงาน</button>` : ''}
                </div>`;
        });
        div.innerHTML = html;
    }
</script>
</body>
</html>
