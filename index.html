<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet - Admin System</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background: #2d5a27; margin: 0; padding: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* สไตล์การ์ดออเดอร์ */
        .order-card { 
            background: white; border-radius: 20px; padding: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); position: relative;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-tag { position: absolute; top: 15px; right: 15px; background: #e67e22; color: white; padding: 4px 12px; border-radius: 10px; font-size: 0.8rem; }
        .cust-info { border-bottom: 2px dashed #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .item-list { background: #f9f9f9; padding: 10px; border-radius: 10px; margin: 10px 0; }
        
        .btn-done { 
            background: #2d5a27; color: white; border: none; width: 100%; 
            padding: 12px; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: 600;
        }
        .btn-done:hover { background: #1e3d1a; }
        
        /* เสียงแจ้งเตือน */
        #notification-sound { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>รายการออเดอร์ใหม่ 👨‍🍳</h1>
        <div id="connection-status" style="font-size: 0.8rem;">เชื่อมต่อฐานข้อมูลแล้ว</div>
    </div>

    <div class="order-grid" id="order-display">
        <!-- รายการออเดอร์จะมาโชว์ตรงนี้ -->
        <div style="color: white; text-align: center; grid-column: 1/-1; padding: 50px;">
            กำลังรอออเดอร์ใหม่...
        </div>
    </div>

    <!-- เสียงแจ้งเตือน (หาไฟล์ .mp3 มาเปลี่ยนลิงก์ได้ครับ) -->
    <audio id="order-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // [1] Firebase Config (ก๊อปจากหน้าบ้านมาวางเลยครับ)
    const firebaseConfig = {
        apiKey: "AIza...",
        databaseURL: "https://your-db-url.asia-southeast1.firebasedatabase.app", 
        projectId: "your-project-id"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // [2] ดึงข้อมูลออเดอร์
    const orderDisplay = document.getElementById('order-display');
    const orderAudio = document.getElementById('order-audio');

    // ฟังเหตุการณ์เมื่อมีออเดอร์ใหม่เพิ่มเข้า Database
    db.ref('orders').orderByChild('timestamp').on('value', (snapshot) => {
        orderDisplay.innerHTML = "";
        const data = snapshot.val();
        
        if (!data) {
            orderDisplay.innerHTML = `<div style="color: white; text-align: center; grid-column: 1/-1; padding: 50px;">ไม่มีออเดอร์ค้างในระบบ</div>`;
            return;
        }

        // เรียงออเดอร์ใหม่ไว้บนสุด
        const sortedKeys = Object.keys(data).reverse();
        
        sortedKeys.forEach(key => {
            const order = data[key];
            const date = new Date(order.timestamp).toLocaleTimeString('th-TH');
            
            // สร้างรายการอาหาร
            let itemsHtml = "";
            for (let id in order.items) {
                if (order.items[id] > 0) {
                    itemsHtml += `<div>• ${id} จำนวน ${order.items[id]}</div>`; 
                    // หมายเหตุ: ตรง id ถ้าอยากให้โชว์ชื่อเมนูภาษาไทย พี่ต้องทำ Mapping ชื่อไว้ครับ
                }
            }

            const card = `
                <div class="order-card" id="card-${key}">
                    <div class="status-tag">${order.payment_type === 'scan' ? '💳 โอนเงิน' : '💵 เงินสด'}</div>
                    <div class="cust-info">
                        <strong>คุณ ${order.customer}</strong> (📞 ${order.tel})<br>
                        <small style="color: #999;">เวลาสั่ง: ${date}</small>
                    </div>
                    
                    <div class="item-list">
                        ${itemsHtml}
                        <div style="margin-top:5px; color: #e67e22; font-size: 0.9rem;">
                            <strong>Note:</strong> ${order.cooking_instruction || '-'}
                        </div>
                    </div>
                    
                    <div style="font-size: 1.2rem; font-weight: bold; text-align: right; margin-bottom: 10px;">
                        รวม: <span style="color: #2d5a27;">${order.total_price}</span>
                    </div>
                    
                    <button class="btn-done" onclick="finishOrder('${key}')">ทำเสร็จแล้ว / ลบ</button>
                </div>
            `;
            orderDisplay.innerHTML += card;
        });
    });

    // ฟังเสียงแจ้งเตือนเมื่อมี Child ใหม่เพิ่มขึ้นมา
    let isFirstLoad = true;
    db.ref('orders').on('child_added', (snapshot) => {
        if (!isFirstLoad) {
            orderAudio.play().catch(e => console.log("รอการคลิกหน้าจอก่อนเล่นเสียง"));
        }
    });
    // ให้ผ่านโหลดครั้งแรกไปก่อน ไม่ให้เสียงดังตอนเปิดหน้าเว็บครั้งแรก
    db.ref('orders').once('value', () => { isFirstLoad = false; });

    // [3] ฟังก์ชันลบออเดอร์เมื่อทำเสร็จ
    function finishOrder(key) {
        if (confirm("ยืนยันว่าทำออเดอร์นี้เสร็จแล้วใช่ไหม?")) {
            db.ref('orders/' + key).remove();
        }
    }
</script>
</body>
</html>
