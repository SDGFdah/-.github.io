<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Admin - Fixed 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2d5a27; --accent: #e67e22; --bg: #f0f2f0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .header-panel { background: var(--primary); padding: 20px; border-radius: 20px; color: white; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* แก้ไขการจัดวาง: ใช้ Grid คุมไม่ให้ทับซ้อน */
        .order-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 20px; /* เว้นระยะห่างระหว่างการ์ด */
            align-items: start;
        }

        .card { 
            background: white; border-radius: 20px; padding: 20px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1); border-top: 8px solid var(--accent);
            display: flex; flex-direction: column; gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .cust-info { border-bottom: 2px dashed #eee; padding-bottom: 10px; }
        .cust-name { font-size: 1.3rem; font-weight: 600; color: var(--primary); margin: 0; }
        .cust-tel { color: var(--accent); font-size: 1.2rem; font-weight: bold; text-decoration: none; }

        .menu-box { background: #f9f9f9; padding: 12px; border-radius: 12px; border: 1px solid #eee; }
        .menu-item { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #f0f0f0; }
        
        .btn-success { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: 0.2s; margin-top: 10px;
        }
        .btn-success:active { transform: scale(0.95); background: #1e3d1a; }
        
        .emergency-row { display: flex; gap: 10px; margin-top: 15px; }
        .emergency-row a { flex: 1; padding: 8px; border-radius: 10px; color: white; text-decoration: none; font-size: 0.8rem; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-panel">
        <h2 style="margin:0">ออเดอร์ลูกค้า 👨‍🍳</h2>
        <div id="status-text" style="font-size: 0.8rem; opacity: 0.8;">กำลังเชื่อมต่อ...</div>
        <div class="emergency-row">
            <a href="tel:191" style="background:#2c3e50">ตำรวจ</a>
            <a href="tel:1669" style="background:#c0392b">กู้ชีพ</a>
            <a href="tel:199" style="background:#d35400">ดับเพลิง</a>
        </div>
    </div>

    <div id="order-grid" class="order-grid">
        <!-- ข้อมูลจะแสดงตรงนี้ -->
    </div>

    <audio id="sound-ding" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // [1] แก้ URL เป็นของพี่เหมือนเดิม
    const BASE_URL = "https://your-db-url.asia-southeast1.firebasedatabase.app/orders"; 
    
    // [2] แมพชื่อเมนูให้ตรงกับ ID
    const menuMap = { 'f1':'กะเพรา', 'f2':'ข้าวผัด', 'f3':'ราดหน้า', 'i1':'น้ำเปล่า', 'i2':'น้ำอัดลม' };

    let lastCount = 0;

    async function refreshOrders() {
        try {
            const response = await fetch(`${BASE_URL}.json`);
            const data = await response.json();
            const grid = document.getElementById('order-grid');
            document.getElementById('status-text').innerText = "🟢 ระบบทำงานปกติ (อัปเดตทุก 2 วิ)";

            if (!data) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999; padding: 50px;">ไม่มีออเดอร์ค้างในระบบค่ะ</div>';
                lastCount = 0;
                return;
            }

            const keys = Object.keys(data).reverse();
            
            // เช็คจำนวนเพื่อเล่นเสียง
            if (keys.length > lastCount && lastCount !== 0) {
                document.getElementById('sound-ding').play().catch(()=>{});
            }
            if (keys.length < lastCount) {
                speakText("มีคนยกเลิกออเดอร์ค่ะ");
            }
            lastCount = keys.length;

            let html = "";
            keys.forEach(key => {
                const o = data[key];
                
                // แก้บัคเมนูไม่ขึ้น: วนลูปอ่านรายการอาหาร
                let itemsHtml = "";
                if (o.items) {
                    for (let id in o.items) {
                        if (o.items[id] > 0) {
                            itemsHtml += `<div class="menu-item"><span>${menuMap[id] || id}</span> <strong>x ${o.items[id]}</strong></div>`;
                        }
                    }
                }

                html += `
                    <div class="card">
                        <div class="cust-info">
                            <p class="cust-name">👤 คุณ ${o.customer || 'ไม่ระบุชื่อ'}</p>
                            <a href="tel:${o.tel}" class="cust-tel">📞 ${o.tel || 'ไม่มีเบอร์'}</a>
                        </div>
                        <div class="menu-box">
                            ${itemsHtml || 'ไม่มีรายการอาหาร'}
                        </div>
                        <div style="font-size:0.9rem; color:#666;">📌 หมายเหตุ: ${o.cooking_instruction || '-'}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:bold; font-size:1.2rem;">รวม: <span style="color:var(--primary)">${o.total_price || '0 ฿'}</span></span>
                            <button class="btn-success" onclick="deleteOrder('${key}')">เสร็จงาน</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

        } catch (error) {
            document.getElementById('status-text').innerText = "🔴 การเชื่อมต่อผิดพลาด";
        }
    }

    async function deleteOrder(key) {
        if (!confirm("ยืนยันว่าทำเสร็จแล้ว?")) return;
        await fetch(`${BASE_URL}/${key}.json`, { method: 'DELETE' });
        refreshOrders();
    }

    function speakText(txt) {
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'th-TH';
        window.speechSynthesis.speak(msg);
    }

    // ตั้งเวลา Refresh ทุก 2 วินาที (สายตรง)
    setInterval(refreshOrders, 2000);
    refreshOrders();

    // ต้องคลิกหน้าจอ 1 ครั้งเพื่อเปิดระบบเสียง
    document.body.onclick = () => { console.log("Sound Ready"); };
</script>
</body>
</html>
