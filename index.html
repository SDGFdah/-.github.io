<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Admin - Official</title>
    
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #2d5a27; --s: #e67e22; --bg: #f4f7f1; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--p); color: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-bar { font-size: 0.8rem; padding: 5px; background: rgba(0,0,0,0.2); transition: 0.3s; }
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; color: #888; }
        .nav-item.active { color: var(--p); border-bottom: 4px solid var(--p); background: #f9f9f9; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { 
            background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-left: 10px solid var(--s); position: relative; margin-bottom: 10px;
        }
        .btn { border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-done { background: var(--p); color: white; }
        .btn-done:hover { background: #1e3d1a; }
        .price { text-align: right; font-weight: 600; color: var(--p); font-size: 1.2rem; margin-top: 10px; }
        .item-list { font-size: 0.9rem; color: #444; line-height: 1.6; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.5rem;">NATURE GOURMET ADMIN</h1>
    <div id="net-status" class="status-bar">⚪ กำลังเชื่อมต่อ...</div>
</header>

<div class="nav">
    <div class="nav-item active" id="nav-live" onclick="changePage('live')">ออเดอร์ใหม่</div>
    <div class="nav-item" id="nav-history" onclick="changePage('history')">ประวัติงาน</div>
</div>

<div class="container">
    <!-- หน้าออเดอร์ปัจจุบัน -->
    <div id="page-live" class="grid">
        <p style="text-align:center; grid-column:1/-1; margin-top:50px; opacity:0.5;">กำลังโหลดข้อมูลจาก verified_orders...</p>
    </div>
    
    <!-- หน้าประวัติ -->
    <div id="page-history" style="display:none;" class="grid">
        <p style="text-align:center; grid-column:1/-1; margin-top:50px; opacity:0.5;">กำลังโหลดประวัติ...</p>
    </div>
</div>

<!-- เสียงแจ้งเตือน -->
<audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // การตั้งค่า Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyARQ9iDSAP-HSnZlHH854p1qnUPCmjtyvo",
        authDomain: "project-8472595372192265726.firebaseapp.com",
        databaseURL: "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "project-8472595372192265726",
        storageBucket: "project-8472595372192265726.firebasestorage.app",
        messagingSenderId: "983091918200",
        appId: "1:983091918200:web:ec462b7eaf04b724f2448d"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // เช็คสถานะเน็ต
    db.ref(".info/connected").on("value", snap => {
        const stat = document.getElementById('net-status');
        if (snap.val() === true) {
            stat.innerText = "🟢 ออนไลน์ - เชื่อมต่อ verified_orders สำเร็จ";
            stat.style.background = "#27ae60";
        } else {
            stat.innerText = "🔴 ออฟไลน์ - กรุณาเช็คอินเทอร์เน็ต";
            stat.style.background = "#c0392b";
        }
    });

    // ดึงออเดอร์ใหม่ (Live)
    db.ref('verified_orders').on('value', snap => {
        renderOrders(snap.val(), 'page-live', true);
        if(snap.val()) { document.getElementById('bell').play().catch(()=>{}); }
    });

    // ดึงประวัติ (History)
    db.ref('history').limitToLast(20).on('value', snap => {
        renderOrders(snap.val(), 'page-history', false);
    });

    // ฟังก์ชันย้ายข้อมูล (เสร็จงาน)
    async function moveOrder(key) {
        const snap = await db.ref('verified_orders/' + key).once('value');
        if(snap.exists()){
            const data = snap.val();
            data.completedAt = new Date().toLocaleString();
            // ย้ายไป history ก่อนแล้วค่อยลบจาก verified_orders
            await db.ref('history').push(data);
            await db.ref('verified_orders/' + key).remove();
        }
    }

    // ฟังก์ชันวาดการ์ดออเดอร์
    function renderOrders(data, targetId, isLive) {
        const div = document.getElementById(targetId);
        if(!data) { 
            div.innerHTML = "<p style='grid-column:1/-1; text-align:center; opacity:0.5; margin-top:50px;'>ไม่มีข้อมูลในส่วนนี้</p>"; 
            return; 
        }
        
        let html = "";
        const keys = Object.keys(data).reverse(); // เอาล่าสุดขึ้นก่อน
        
        keys.forEach(key => {
            const o = data[key];
            let itemsHtml = "";
            if(o.items) {
                for(let name in o.items) {
                    if(o.items[name] > 0) itemsHtml += `• ${name} x ${o.items[name]}<br>`;
                }
            }

            html += `
                <div class="card" style="${!isLive ? 'border-left-color:#ccc; opacity:0.7;' : ''}">
                    <div style="font-weight:600; font-size:1.1rem; color:var(--p);">คุณ ${o.customer || 'ไม่ระบุชื่อ'}</div>
                    <div style="font-size:0.85rem; color:#666;">📞 ${o.tel || '-'}</div>
                    <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                    <div class="item-list">${itemsHtml || 'ไม่มีรายการอาหาร'}</div>
                    <div style="font-size:0.8rem; color:#888; margin-top:5px;">📝 ${o.cooking_instruction || '-'}</div>
                    <div class="price">${Number(o.total_price).toLocaleString()} บาท</div>
                    ${isLive ? `<button class="btn btn-done" onclick="moveOrder('${key}')">✔️ เสร็จงาน / เก็บประวัติ</button>` : `<div style="font-size:0.7rem; text-align:center; margin-top:10px; color:#999;">เสร็จสิ้นเมื่อ: ${o.completedAt || '-'}</div>`}
                </div>`;
        });
        div.innerHTML = html;
    }

    function changePage(p) {
        document.getElementById('page-live').style.display = p === 'live' ? 'grid' : 'none';
        document.getElementById('page-history').style.display = p === 'history' ? 'grid' : 'none';
        document.getElementById('nav-live').classList.toggle('active', p === 'live');
        document.getElementById('nav-history').classList.toggle('active', p === 'history');
    }
</script>

</body>
</html>
