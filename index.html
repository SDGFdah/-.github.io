<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Nature Gourmet Admin - LIGHT SPEED ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #0e230c; margin: 0; padding: 15px; color: #fff; }
        .header { text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-bottom: 15px; }
        .order-card { background: white; color: #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 10px solid #e67e22; animation: flash 0.5s; }
        @keyframes flash { from { background: #ffeaa7; } to { background: white; } }
        .cust-tel { color: #d35400; font-weight: bold; font-size: 1.2rem; }
        .item-box { background: #f1f2f6; padding: 10px; border-radius: 10px; margin: 10px 0; }
        .btn-done { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .emergency { display: flex; gap: 5px; margin-bottom: 15px; }
        .emergency a { flex: 1; text-align: center; padding: 10px; border-radius: 8px; color: white; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ออเดอร์เข้าใหม่วันนี้ 👩‍🍳</h1>
        <small id="status">🔴 กำลังเชื่อมต่อสายตรง...</small>
    </div>

    <div class="emergency">
        <a href="tel:191" style="background:#2c3e50">ตำรวจ</a>
        <a href="tel:1669" style="background:#c0392b">กู้ชีพ</a>
        <a href="tel:199" style="background:#d35400">ดับเพลิง</a>
    </div>

    <div id="order-display"></div>

    <script>
        // *** แก้ตรงนี้ให้เป็น URL ของพี่นะ ***
        const DB_URL = "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",
        const DELETE_BASE_URL = "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",

        const menuMap = { 'f1':'กะเพรา', 'f2':'ข้าวผัด', 'f3':'ราดหน้า', 'i1':'น้ำเปล่า', 'i2':'น้ำอัดลม' };

        // ฟังก์ชันลบออเดอร์
        async function finishOrder(key) {
            if(!confirm("เสร็จแล้วนะ?")) return;
            await fetch(`${DELETE_BASE_URL}${key}.json`, { method: 'DELETE' });
            loadOrders(); // โหลดใหม่ทันที
        }

        // ฟังก์ชันอ่านข้อมูล (สายตรง ไม่ผ่าน Library)
        async function loadOrders() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                const display = document.getElementById('order-display');
                document.getElementById('status').innerText = "🟢 เชื่อมต่อเสถียร (Auto-Refresh)";
                
                if (!data) {
                    display.innerHTML = "<p style='text-align:center'>ยังไม่มีออเดอร์ใหม่ครับ</p>";
                    return;
                }

                let html = "";
                // เรียงจากใหม่ไปเก่า
                const keys = Object.keys(data).reverse();
                
                keys.forEach(key => {
                    const o = data[key];
                    let items = "";
                    for(let id in o.items) {
                        if(o.items[id] > 0) items += `<div>• ${menuMap[id] || id} x ${o.items[id]}</div>`;
                    }

                    html += `
                        <div class="order-card">
                            <div style="font-size:1.3rem"><strong>คุณ ${o.customer}</strong></div>
                            <a href="tel:${o.tel}" class="cust-tel">📞 ${o.tel}</a>
                            <div class="item-box">${items}</div>
                            <div style="color:#e67e22">📌 Note: ${o.cooking_instruction || '-'}</div>
                            <h3 style="text-align:right; margin:10px 0;">รวม ${o.total_price}</h3>
                            <button class="btn-done" onclick="finishOrder('${key}')">เสร็จงาน/ลบ</button>
                        </div>
                    `;
                });
                display.innerHTML = html;
            } catch (e) {
                document.getElementById('status').innerText = "🔴 เน็ตหลุดหรือ URL ผิด";
            }
        }

        // ตั้งเวลาเช็กออเดอร์ทุกๆ 2 วินาที (กดปุ๊บ มาปั๊บของจริง)
        setInterval(loadOrders, 2000);
        loadOrders();
    </script>
</body>
</html>
