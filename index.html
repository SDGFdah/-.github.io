<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Admin - Private Studio</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #2d5a27; --s: #e67e22; --bg-default: #f4f7f1; }
        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            background: var(--bg-default);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            transition: 0.5s;
        }
        
        header { background: var(--p); color: white; padding: 15px; text-align: center; position: relative; z-index: 10; }
        .status-bar { font-size: 0.8rem; padding: 5px; background: rgba(0,0,0,0.3); }
        
        /* สลับหน้าเมนู */
        .nav { display: flex; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #ddd; }
        .nav-item { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; color: #666; transition: 0.3s; }
        .nav-item.active { color: var(--p); border-bottom: 4px solid var(--p); background: rgba(255,255,255,1); }

        /* ส่วนตกแต่งพื้นหลัง (เห็นคนเดียว) */
        .admin-tools { background: rgba(0,0,0,0.7); color: white; padding: 10px; font-size: 0.8rem; display: flex; gap: 10px; justify-content: center; align-items: center; }
        .admin-tools input[type="text"] { border-radius: 5px; border: none; padding: 5px; width: 150px; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .card { 
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-left: 10px solid var(--s);
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn { border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; font-family: 'Kanit'; margin-top: 10px; }
        .btn-done { background: var(--p); color: white; }
        .btn-done:hover { transform: scale(1.02); background: #1e3d1a; }

        .total-price { text-align: right; font-size: 1.4rem; font-weight: 600; color: var(--p); margin: 10px 0; }
        .item-row { padding: 5px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body id="main-body">

<header>
    <h1 style="margin:0; font-size: 1.5rem;">NATURE GOURMET ADMIN</h1>
    <div id="net-status" class="status-bar">⚪ กำลังเชื่อมต่อ...</div>
</header>

<!-- เครื่องมือแต่งร้าน (เห็นเฉพาะเครื่องนี้) -->
<div class="admin-tools">
    <span>🎨 แต่งพื้นหลัง:</span>
    <input type="text" id="bg-url" placeholder="วางลิงก์รูปจากเน็ต...">
    <button onclick="changeBg('url')">ใช้ลิงก์</button>
    <input type="file" id="bg-file" accept="image/*" style="display:none" onchange="changeBg('file')">
    <button onclick="document.getElementById('bg-file').click()">อัปโหลดรูป</button>
    <button onclick="resetBg()" style="background:#f44336; color:white; border:none; border-radius:3px;">ล้าง</button>
</div>

<div class="nav">
    <div class="nav-item active" id="nav-live" onclick="showPage('live')">ออเดอร์ใหม่</div>
    <div class="nav-item" id="nav-history" onclick="showPage('history')">ประวัติงาน</div>
</div>

<div class="container">
    <div id="page-live" class="grid">
        <p style="text-align:center; grid-column:1/-1; margin-top:50px;">รอออเดอร์จากระบบ...</p>
    </div>
    <div id="page-history" style="display:none;" class="grid"></div>
</div>

<audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyARQ9iDSAP-HSnZlHH854p1qnUPCmjtyvo",
        authDomain: "project-8472595372192265726.firebaseapp.com",
        databaseURL: "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "project-8472595372192265726",
        storageBucket: "project-8472595372192265726.firebasestorage.app",
        messagingSenderId: "983091918200",
        appId: "1:983091918200:web:ec462b7eaf04b724f2448d"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    let currentData = {};

    // --- ระบบพื้นหลัง (เซฟลงเครื่องคนใช้เท่านั้น) ---
    function changeBg(type) {
        if(type === 'url') {
            const url = document.getElementById('bg-url').value;
            if(url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('my_admin_bg', url);
            }
        } else {
            const file = document.getElementById('bg-file').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                document.body.style.backgroundImage = `url('${reader.result}')`;
                localStorage.setItem('my_admin_bg', reader.result);
            }
            if(file) reader.readAsDataURL(file);
        }
    }
    function resetBg() {
        document.body.style.backgroundImage = '';
        localStorage.removeItem('my_admin_bg');
    }
    // โหลดพื้นหลังที่เคยเซฟไว้
    if(localStorage.getItem('my_admin_bg')) {
        document.body.style.backgroundImage = `url('${localStorage.getItem('my_admin_bg')}')`;
    }

    // --- ระบบ Firebase (เน้นเสถียร) ---
    db.ref(".info/connected").on("value", snap => {
        const s = document.getElementById('net-status');
        s.innerText = snap.val() ? "🟢 เชื่อมต่อเสถียร - " + new Date().toLocaleTimeString() : "🔴 ขาดการเชื่อมต่อ";
    });

    // ดึงข้อมูลแบบ Real-time
    db.ref('verified_orders').on('value', snap => {
        const data = snap.val();
        if(JSON.stringify(data) !== JSON.stringify(currentData)) {
            currentData = data;
            render(data, 'page-live', true);
            if(data) document.getElementById('bell').play().catch(()=>{});
        }
    });

    db.ref('history').limitToLast(20).on('value', snap => {
        render(snap.val(), 'page-history', false);
    });

    async function moveOrder(key) {
        const snap = await db.ref('verified_orders/' + key).once('value');
        if(snap.exists()) {
            const val = snap.val();
            val.doneAt = new Date().toLocaleString();
            await db.ref('history').push(val);
            await db.ref('verified_orders/' + key).remove();
        }
    }

    function render(data, targetId, isLive) {
        const container = document.getElementById(targetId);
        if(!data) {
            container.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:50px; background:rgba(255,255,255,0.8); border-radius:15px;">ไม่มีออเดอร์ในขณะนี้</p>`;
            return;
        }

        let html = "";
        const keys = Object.keys(data).reverse();
        keys.forEach(key => {
            const o = data[key];
            let itemHtml = "";
            for(let name in o.items) {
                if(o.items[name] > 0) itemHtml += `<div class="item-row"><span>${name}</span><span>x${o.items[name]}</span></div>`;
            }

            html += `
                <div class="card" style="${!isLive ? 'border-left-color:#999; opacity:0.8;' : ''}">
                    <div style="font-weight:600; color:var(--p); font-size:1.2rem;">คุณ ${o.customer || 'ลูกค้า'}</div>
                    <div style="color:var(--s); font-size:0.9rem;">📞 ${o.tel || '-'}</div>
                    <div style="margin-top:10px;">${itemHtml}</div>
                    <div class="total-price">${Number(o.total_price || 0).toLocaleString()} บาท</div>
                    ${o.cooking_instruction ? `<div style="font-size:0.8rem; color:#666; background:#eee; padding:5px; border-radius:5px;">📝 ${o.cooking_instruction}</div>` : ''}
                    ${isLive ? `<button class="btn btn-done" onclick="moveOrder('${key}')">เสร็จสิ้นงานนี้</button>` : `<div style="font-size:0.7rem; color:#999; text-align:center; margin-top:5px;">จบงานเมื่อ: ${o.doneAt}</div>`}
                </div>`;
        });
        container.innerHTML = html;
    }

    function showPage(page) {
        document.getElementById('page-live').style.display = page === 'live' ? 'grid' : 'none';
        document.getElementById('page-history').style.display = page === 'history' ? 'grid' : 'none';
        document.getElementById('nav-live').className = 'nav-item ' + (page === 'live' ? 'active' : '');
        document.getElementById('nav-history').className = 'nav-item ' + (page === 'history' ? 'active' : '');
    }
</script>

</body>
</html>
