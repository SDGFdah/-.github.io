<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet - Custom Admin</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #2d5a27; --s: #e67e22; --bg: #f4f7f1; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; transition: 0.5s; }
        
        header { background: var(--p); color: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; color: #888; transition: 0.3s; }
        .nav-item.active { color: var(--p); border-bottom: 4px solid var(--p); background: #f9f9f9; }

        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Order Card */
        .card { 
            background: white; border-radius: 25px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-left: 10px solid var(--s); position: relative; animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Mascot - ตกแต่งแบบลากวางได้ */
        #my-mascot { 
            position: fixed; bottom: 20px; right: 20px; width: 150px; 
            z-index: 9999; cursor: move; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        /* Settings */
        .settings-pane { background: white; padding: 25px; border-radius: 25px; max-width: 550px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--p); }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #eee; }

        .btn { border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-save { background: var(--p); color: white; width: 100%; margin-top: 10px; }
        .btn-save:hover { background: #1e3d1a; }
    </style>
</head>
<body ondrop="drop(event)" ondragover="allowDrop(event)">

<header>
    <h1 style="margin:0">NATURE GOURMET ADMIN 👨‍🍳</h1>
</header>

<div class="nav">
    <div class="nav-item active" onclick="showPage('live')">ออเดอร์เข้า</div>
    <div class="nav-item" onclick="showPage('history')">ประวัติ</div>
    <div class="nav-item" onclick="showPage('settings')">ตกแต่งร้าน</div>
</div>

<div class="container">
    <div id="page-live" class="grid"></div>
    <div id="page-history" style="display:none;" class="grid"></div>
    
    <div id="page-settings" style="display:none;">
        <div class="settings-pane">
            <h3 style="margin-top:0; color:var(--p)">🎨 ตกแต่งหน้าจอของคุณ (เฉพาะเครื่องนี้)</h3>
            
            <div class="field">
                <label>สีพื้นหลัง:</label>
                <input type="color" id="bg-color" onchange="applyLocalDecor()">
            </div>

            <div class="field">
                <label>ใส่ลิงก์รูปจากเน็ต (URL):</label>
                <input type="text" id="mascot-url" placeholder="วางลิงก์รูป .png หรือ .jpg ที่นี่" oninput="applyLocalDecor()">
            </div>

            <div class="field">
                <label>หรือ อัปโหลดรูปจากเครื่อง:</label>
                <input type="file" id="mascot-file" accept="image/*" onchange="handleFileUpload(this)">
            </div>

            <p style="font-size: 0.8rem; color: #888;">* รูปตกแต่งสามารถคลิกลากวางตำแหน่งใดก็ได้บนหน้าจอ</p>
            <button class="btn btn-save" onclick="saveDecor()">💾 บันทึกการตกแต่งถาวร</button>
        </div>
    </div>
</div>

<!-- รูปตกแต่ง (Mascot) -->
<img src="" id="my-mascot" draggable="true" ondragstart="drag(event)">

<audio id="ding" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // [1] FIREBASE CONFIG (พี่เปลี่ยนเป็นของพี่นะครับ)
    const firebaseConfig = {
        apiKey: "ใส่_API_KEY",
        databaseURL: "ใส่_URL",
        projectId: "ใส่_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const menuMap = { 'f1':'กะเพรา', 'f2':'ข้าวผัด', 'f3':'ราดหน้า', 'i1':'น้ำเปล่า', 'i2':'น้ำอัดลม' };

    // [2] ระบบลากวาง (Drag & Drop)
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        var el = document.getElementById(data);
        el.style.left = ev.clientX - (el.offsetWidth/2) + "px";
        el.style.top = ev.clientY - (el.offsetHeight/2) + "px";
        el.style.bottom = "auto"; el.style.right = "auto";
    }

    // [3] ระบบตกแต่งเฉพาะเครื่อง (LocalStorage)
    function handleFileUpload(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('my-mascot').src = e.target.result;
            document.getElementById('mascot-url').value = ""; // ล้างค่า URL
        };
        reader.readAsDataURL(file);
    }

    function applyLocalDecor() {
        const bg = document.getElementById('bg-color').value;
        const url = document.getElementById('mascot-url').value;
        document.body.style.background = bg;
        if(url) document.getElementById('my-mascot').src = url;
    }

    function saveDecor() {
        const decor = {
            bg: document.getElementById('bg-color').value,
            img: document.getElementById('my-mascot').src
        };
        localStorage.setItem('my_admin_decor', JSON.stringify(decor));
        alert("บันทึกการตกแต่งเฉพาะเครื่องเรียบร้อย!");
    }

    // โหลดการตกแต่งที่เคยเซฟไว้
    window.onload = () => {
        const saved = localStorage.getItem('my_admin_decor');
        if(saved) {
            const d = JSON.parse(saved);
            document.body.style.background = d.bg;
            document.getElementById('my-mascot').src = d.img;
            document.getElementById('bg-color').value = d.bg;
        }
    };

    // [4] ระบบดึงข้อมูลออเดอร์ (เหมือนเดิมแต่เสถียรขึ้น)
    db.ref('orders').on('value', snap => {
        const data = snap.val();
        render(data, 'page-live', true);
        if(data && Object.keys(data).length > 0) document.getElementById('ding').play().catch(()=>{});
    });

    db.ref('history').limitToLast(50).on('value', snap => {
        render(snap.val(), 'page-history', false);
    });

    function render(data, targetId, isLive) {
        const container = document.getElementById(targetId);
        if(!data) { container.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>ว่างเปล่า...</p>"; return; }
        let html = "";
        Object.keys(data).reverse().forEach(key => {
            const o = data[key];
            let items = "";
            for(let id in o.items) if(o.items[id]>0) items += `• ${menuMap[id]||id} x ${o.items[id]}<br>`;
            
            html += `
            <div class="card" style="${!isLive ? 'opacity:0.7; border-left-color:#ccc;' : ''}">
                <div style="font-weight:600; font-size:1.1rem;">คุณ ${o.customer}</div>
                <div style="color:var(--s); font-weight:bold;">📞 ${o.tel}</div>
                <div style="margin:10px 0; font-size:0.95rem; background:#f9f9f9; padding:10px; border-radius:10px;">${items}</div>
                ${isLive ? `<button class="btn btn-save" onclick="done('${key}')">เสร็จงาน</button>` : `<small>${o.status === 'completed' ? '✅ สำเร็จ' : '❌ ยกเลิก'}</small>`}
            </div>`;
        });
        container.innerHTML = html;
    }

    async function done(key) {
        const snap = await db.ref('orders/' + key).once('value');
        const val = snap.val();
        if(val) {
            val.status = 'completed';
            val.finishedAt = firebase.database.ServerValue.TIMESTAMP;
            await db.ref('history').push(val);
            await db.ref('orders/' + key).remove();
        }
    }

    function showPage(p) {
        document.querySelectorAll('.tab-content, .grid, #page-settings').forEach(e => e.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        document.getElementById('page-' + p).style.display = p === 'settings' ? 'block' : 'grid';
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
